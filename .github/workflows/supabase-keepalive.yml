# Mantém o projeto Supabase (plano grátis) acordado: o plano pausa depois de ~1 semana sem uso.
# Secrets do repositório (Settings > Secrets and variables > Actions): SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY.
# Sem os secrets, o job só avisa e termina sem erro.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets do Supabase ainda não configurados; nada a fazer."
            exit 0
          fi
          auth=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "auth/health respondeu $auth"
          # consulta de verdade ao banco (a tabela "artistas" nasce na fase 2; antes disso o REST devolve 404/401, e tudo bem)
          rest=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/artistas?select=slug&limit=1" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "rest/artistas respondeu $rest"
          test "$auth" = "200"
