# Mantém o projeto Supabase (plano grátis) acordado: o plano pausa depois de ~1 semana sem uso.
# Precisa dos secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório (Settings > Secrets and variables > Actions).
# Sem os secrets, o job só avisa e termina sem erro.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 09:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets do Supabase ainda não configurados; nada a fazer."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondeu $code"
          test "$code" -lt 500
